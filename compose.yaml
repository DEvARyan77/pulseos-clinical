name: pulseos
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init-env.sh}
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/init-env.sh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PULSEOS_AUTH_ENABLED: ${PULSEOS_AUTH_ENABLED:-false}
      PULSEOS_AUTH_USERNAME: ${PULSEOS_AUTH_USERNAME:-}
      PULSEOS_AUTH_PASSWORD_HASH: ${PULSEOS_AUTH_PASSWORD_HASH:-}
      PULSEOS_AUTH_JWT_SECRET_BASE64: ${PULSEOS_AUTH_JWT_SECRET_BASE64:-}
      PULSEOS_REGISTRATION_ENABLED: ${PULSEOS_REGISTRATION_ENABLED:-false}
      PULSEOS_REGISTRATION_INVITE_CODE: ${PULSEOS_REGISTRATION_INVITE_CODE:-}
      PULSEOS_EMAIL_PROVIDER: ${PULSEOS_EMAIL_PROVIDER:-disabled}
      PULSEOS_EMAIL_FROM: ${PULSEOS_EMAIL_FROM:-}
      PULSEOS_PUBLIC_URL: ${PULSEOS_PUBLIC_URL:-}
      PULSEOS_DEMO_EMAIL_ALLOWLIST: ${PULSEOS_DEMO_EMAIL_ALLOWLIST:-}
      PULSEOS_APPOINTMENT_REMINDERS_ENABLED: ${PULSEOS_APPOINTMENT_REMINDERS_ENABLED:-false}
      PULSEOS_RESEND_API_KEY: ${PULSEOS_RESEND_API_KEY:-}
      PULSEOS_GOOGLE_SCRIPT_URL: ${PULSEOS_GOOGLE_SCRIPT_URL:-}
      PULSEOS_GOOGLE_SCRIPT_KEY: ${PULSEOS_GOOGLE_SCRIPT_KEY:-}
      PULSEOS_SMTP_HOST: ${PULSEOS_SMTP_HOST:-}
      PULSEOS_SMTP_PORT: ${PULSEOS_SMTP_PORT:-587}
      PULSEOS_SMTP_USER: ${PULSEOS_SMTP_USER:-}
      PULSEOS_SMTP_PASSWORD: ${PULSEOS_SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
    networks: [internal]
  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      NODE_ENV: production
      PULSEOS_AUTH_ENABLED: ${PULSEOS_AUTH_ENABLED:-false}
      PULSEOS_REGISTRATION_ENABLED: ${PULSEOS_REGISTRATION_ENABLED:-false}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
networks:
  internal:
volumes:
  postgres_data:
