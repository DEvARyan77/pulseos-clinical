server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: pulseos-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulseos}
    username: ${SPRING_DATASOURCE_USERNAME:pulseos}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
pulseos:
  auth:
    enabled: ${PULSEOS_AUTH_ENABLED:false}
