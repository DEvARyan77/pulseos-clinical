server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: pulseos-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pulseos}
    username: ${SPRING_DATASOURCE_USERNAME:pulseos}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${PULSEOS_SMTP_HOST:}
    port: ${PULSEOS_SMTP_PORT:587}
    username: ${PULSEOS_SMTP_USER:}
    password: ${PULSEOS_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
pulseos:
  auth:
    enabled: ${PULSEOS_AUTH_ENABLED:false}
