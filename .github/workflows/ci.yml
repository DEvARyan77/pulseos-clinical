name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pulseos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulseos_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PULSEOS_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/pulseos_test
      PULSEOS_TEST_DATABASE_USERNAME: postgres
      PULSEOS_TEST_DATABASE_PASSWORD: disposable-ci-only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - run: mvn -B verify
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
